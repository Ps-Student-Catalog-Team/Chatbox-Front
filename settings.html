<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/photos/ico/favicon.ico" type="image/x-icon">
    <title>设置 | 局域网通讯</title>
    <script src="./js/viewport-adapter.js"></script>
    <script src="./js/tailwind.browser.js"></script>
    <script src="./js/notification.js"></script>
    <script>
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        });
    </script>
    <link rel="stylesheet" href="css/settings-desktop.css">
    <link rel="stylesheet" href="css/settings-mobile.css" media="(max-width: 768px)">
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-900">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-2xl bg-white rounded-[28px] shadow-2xl border border-slate-200 overflow-hidden">
            <div class="p-6 md:p-8 space-y-6">
                <div class="flex items-start justify-between gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900">用户设置</h1>
                        <p class="text-sm text-slate-500 mt-1">在此更改账号名、访问密码修改页面，并管理消息提醒。</p>
                    </div>
                    <button onclick="goBack()" class="rounded-2xl border border-slate-200 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 transition">返回聊天</button>
                </div>

                <section class="space-y-4 bg-slate-50 p-5 rounded-3xl border border-slate-100">
                    <div class="flex items-center justify-between gap-4">
                        <div>
                            <h2 class="text-lg font-semibold text-slate-900">账户设置</h2>
                            <p class="text-sm text-slate-500">修改当前登录账号名称。</p>
                        </div>
                        <a id="passwordResetLink" href="forgot-password.html" class="text-sm font-semibold text-blue-600 hover:text-blue-700">修改密码</a>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-2">账号名称</label>
                            <input id="usernameInput" type="text" placeholder="请输入新的账号名称" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition" autocapitalize="off">
                        </div>
                        <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                            <p id="accountFeedback" class="text-sm text-slate-500"></p>
                            <button onclick="saveUsername()" class="inline-flex items-center justify-center rounded-2xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 transition">保存账号名称</button>
                        </div>
                    </div>
                </section>

                <section class="space-y-4 bg-slate-50 p-5 rounded-3xl border border-slate-100">
                    <div>
                        <h2 class="text-lg font-semibold text-slate-900">消息提醒设置</h2>
                        <p class="text-sm text-slate-500">在此启用或禁用通知选项，设置会保存在本地。</p>
                    </div>
                    <div class="grid gap-4">
                        <div class="flex items-center justify-between rounded-2xl border border-slate-200 bg-white p-4">
                            <div>
                                <p class="font-medium text-slate-800">🔔 桌面通知</p>
                                <p class="text-xs text-slate-500 mt-1">在系统通知中显示新消息。</p>
                            </div>
                            <label class="relative inline-flex h-7 w-14 items-center rounded-full bg-slate-300 cursor-pointer transition-colors" id="desktopNotificationToggle">
                                <input id="toggleDesktopNotification" type="checkbox" class="sr-only" onchange="updateNotificationSetting('enableDesktopNotification', this.checked)">
                                <span id="desktopNotificationCircle" class="pointer-events-none inline-block h-5 w-5 rounded-full bg-white shadow-sm transform transition-transform"></span>
                            </label>
                        </div>
                        <div class="flex items-center justify-between rounded-2xl border border-slate-200 bg-white p-4">
                            <div>
                                <p class="font-medium text-slate-800">🔊 提示音</p>
                                <p class="text-xs text-slate-500 mt-1">收到消息时播放提示音。</p>
                            </div>
                            <label class="relative inline-flex h-7 w-14 items-center rounded-full bg-slate-300 cursor-pointer transition-colors" id="soundToggle">
                                <input id="toggleSound" type="checkbox" class="sr-only" onchange="updateNotificationSetting('enableSound', this.checked)">
                                <span id="soundCircle" class="pointer-events-none inline-block h-5 w-5 rounded-full bg-white shadow-sm transform transition-transform"></span>
                            </label>
                        </div>
                        <div class="flex items-center justify-between rounded-2xl border border-slate-200 bg-white p-4">
                            <div>
                                <p class="font-medium text-slate-800">🏷️ 未读徽章</p>
                                <p class="text-xs text-slate-500 mt-1">在列表中显示未读消息计数。</p>
                            </div>
                            <label class="relative inline-flex h-7 w-14 items-center rounded-full bg-slate-300 cursor-pointer transition-colors" id="badgeToggle">
                                <input id="toggleBadge" type="checkbox" class="sr-only" onchange="updateNotificationSetting('enableBadge', this.checked)">
                                <span id="badgeCircle" class="pointer-events-none inline-block h-5 w-5 rounded-full bg-white shadow-sm transform transition-transform"></span>
                            </label>
                        </div>
                        <div class="flex items-center justify-between rounded-2xl border border-slate-200 bg-white p-4">
                            <div>
                                <p class="font-medium text-slate-800">📌 标题提醒</p>
                                <p class="text-xs text-slate-500 mt-1">在浏览器标签页显示未读提醒。</p>
                            </div>
                            <label class="relative inline-flex h-7 w-14 items-center rounded-full bg-slate-300 cursor-pointer transition-colors" id="titleBlinkToggle">
                                <input id="toggleTitleBlink" type="checkbox" class="sr-only" onchange="updateNotificationSetting('enableTitleBlink', this.checked)">
                                <span id="titleBlinkCircle" class="pointer-events-none inline-block h-5 w-5 rounded-full bg-white shadow-sm transform transition-transform"></span>
                            </label>
                        </div>
                    </div>
                </section>

                <section id="personalizationSection" class="space-y-4 bg-slate-50 p-5 rounded-3xl border border-slate-100">
                    <div>
                        <h2 class="text-lg font-semibold text-slate-900">个性化设置</h2>
                        <p class="text-sm text-slate-500">点选下面的项目来管理聊天背景和全局字体。</p>
                    </div>

                    <div class="flex gap-4">
                        <button id="openBgBtn" onclick="togglePanel('bg')" class="flex-1 py-4 rounded-2xl bg-blue-600 text-white font-semibold text-lg">聊天背景</button>
                        <button id="openFontBtn" onclick="togglePanel('font')" class="flex-1 py-4 rounded-2xl bg-slate-800 text-white font-semibold text-lg">全局字体</button>
                    </div>

                    <!-- 背景面板 -->
                    <div id="bgPanel" class="mt-4 hidden collapsible-panel">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-2">
                                <button onclick="document.getElementById('personalBgInput').click()" class="px-4 py-2 bg-blue-600 text-white rounded-2xl">上传背景</button>
                                <div class="text-sm text-slate-500">可见性：<label class="ml-2"><input type="radio" name="bgVisibility" value="private" checked> 私密</label><label class="ml-2"><input type="radio" name="bgVisibility" value="public"> 公开</label></div>
                            </div>
                            <button class="px-3 py-1 text-sm bg-slate-100 rounded" onclick="toggleCollapse('userBgContainer')">我的背景 ▾</button>
                        </div>
                        <input id="personalBgInput" type="file" accept="image/*" class="hidden" onchange="uploadAsset('personalBgInput','background')" />

                        <div id="userBgContainer" class="mb-4">
                            <div class="text-sm font-semibold text-slate-700 mb-2">我的背景</div>
                            <div id="userBgList" class="flex flex-wrap gap-2"></div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <div class="text-sm font-semibold text-slate-700">公共背景</div>
                                <div class="flex items-center gap-2">
                                    <button class="px-3 py-1 text-sm bg-slate-100 rounded" onclick="toggleCollapse('publicBgContainer')">折叠/展开</button>
                                    <button class="px-3 py-1 text-sm bg-slate-100 rounded" onclick="openGallery(window.publicBgAssets, '公共背景')">全览并选择</button>
                                </div>
                            </div>
                            <div id="publicBgContainer">
                                <div id="publicBgList" class="flex flex-wrap gap-2 mb-4"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 字体面板 -->
                    <div id="fontPanel" class="mt-4 hidden collapsible-panel">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-2">
                                <button onclick="document.getElementById('personalFontInput').click()" class="px-4 py-2 bg-blue-600 text-white rounded-2xl">上传字体</button>
                                <div class="text-sm text-slate-500">可见性：<label class="ml-2"><input type="radio" name="fontVisibility" value="private" checked> 私密</label><label class="ml-2"><input type="radio" name="fontVisibility" value="public"> 公开</label></div>
                            </div>
                        </div>
                        <input id="personalFontInput" type="file" accept=".ttf,.otf,.woff,.woff2" class="hidden" onchange="uploadAsset('personalFontInput','font')" />

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <div class="text-sm font-semibold text-slate-700 mb-2">我的字体</div>
                                <div id="userFontList" class="flex flex-col gap-2"></div>
                            </div>
                            <div>
                                <div class="text-sm font-semibold text-slate-700 mb-2">公共字体</div>
                                <div id="publicFontList" class="flex flex-col gap-2"></div>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="rounded-3xl bg-slate-50 p-4 border border-slate-100 text-sm text-slate-500">
                    设置将自动保存到本地，刷新后仍然保留。若需要修改密码，请点击“修改密码”。
                </div>
            </div>
        </div>
    </div>

    <script>
        const authTokenKey = 'lanchat_auth_token';
        const authUserKey = 'lanchat_auth_user';

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.innerText = message;
            toast.className = `fixed bottom-6 left-1/2 z-50 w-auto max-w-xs -translate-x-1/2 rounded-2xl px-4 py-3 text-sm font-medium text-white shadow-lg transition-opacity duration-300 ${isError ? 'bg-red-500' : 'bg-slate-900'}`;
            toast.style.opacity = '0';
            document.body.appendChild(toast);
            requestAnimationFrame(() => {
                toast.style.opacity = '1';
            });
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2600);
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function updateToggleVisual(toggleName, enabled) {
            const toggle = document.getElementById(`${toggleName}Toggle`);
            const circle = document.getElementById(`${toggleName}Circle`);
            if (!toggle || !circle) return;
            toggle.style.backgroundColor = enabled ? '#2563eb' : '#cbd5e1';
            // 计算实际可移动的像素距离，兼容不同缩放与 padding
            const padding = 6; // 保留一点内边距
            const currentOffset = circle.offsetLeft || 0;
            const desiredOffset = Math.max(0, toggle.clientWidth - circle.offsetWidth - padding);
            const translate = Math.max(0, Math.round(desiredOffset - currentOffset));
            circle.style.transform = enabled ? `translateX(${translate}px)` : 'translateX(0)';
        }

        function updateNotificationSettingsUI() {
            const config = NotificationManager.getConfig();
            document.getElementById('toggleDesktopNotification').checked = config.enableDesktopNotification;
            document.getElementById('toggleSound').checked = config.enableSound;
            document.getElementById('toggleBadge').checked = config.enableBadge;
            document.getElementById('toggleTitleBlink').checked = config.enableTitleBlink;

            updateToggleVisual('desktopNotification', config.enableDesktopNotification);
            updateToggleVisual('sound', config.enableSound);
            updateToggleVisual('badge', config.enableBadge);
            updateToggleVisual('titleBlink', config.enableTitleBlink);
        }

        function getToggleName(key) {
            const name = key.replace(/^enable/, '');
            return name.charAt(0).toLowerCase() + name.slice(1);
        }

        function updateNotificationSetting(key, value) {
            NotificationManager.saveSettings({ [key]: value });
            updateToggleVisual(getToggleName(key), value);
            if (key === 'enableDesktopNotification' && value) {
                NotificationManager.requestNotificationPermission().then(granted => {
                    if (!granted) {
                        showToast('浏览器通知权限未授予，请检查浏览器设置。', true);
                        document.getElementById('toggleDesktopNotification').checked = false;
                        updateToggleVisual('desktopNotification', false);
                        NotificationManager.saveSettings({ enableDesktopNotification: false });
                    }
                });
            }
        }

        async function restoreUserInfo() {
            const token = localStorage.getItem(authTokenKey);
            const savedUser = localStorage.getItem(authUserKey);

            if (!token || !savedUser) {
                window.location.href = 'index.html';
                return;
            }

            const usernameInput = document.getElementById('usernameInput');
            const passwordResetLink = document.getElementById('passwordResetLink');
            passwordResetLink.href = `forgot-password.html?username=${encodeURIComponent(savedUser)}`;

            usernameInput.value = savedUser;

            try {
                const res = await fetch(`/api/user/info?username=${encodeURIComponent(savedUser)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.username) {
                        usernameInput.value = data.username;
                    }
                }
            } catch (err) {
                console.warn('无法获取用户信息', err);
            }
        }

        // 在窗口尺寸变化时重新计算开关位置
        function recalcAllToggles() {
            ['desktopNotification','sound','badge','titleBlink'].forEach(name => {
                const checkbox = document.getElementById('toggle' + (name.charAt(0).toUpperCase() + name.slice(1)));
                if (checkbox) updateToggleVisual(name, checkbox.checked);
            });
        }

        window.addEventListener('resize', () => {
            // 防抖
            clearTimeout(window.__recalcToggleTimer);
            window.__recalcToggleTimer = setTimeout(recalcAllToggles, 120);
        });

        async function saveUsername() {
            const token = localStorage.getItem(authTokenKey);
            const usernameInput = document.getElementById('usernameInput');
            const newUsername = usernameInput.value.trim();
            const currentUser = localStorage.getItem(authUserKey);

            if (!token || !currentUser) {
                window.location.href = 'index.html';
                return;
            }
            if (!newUsername) {
                showToast('账号名称不能为空。', true);
                return;
            }
            if (newUsername === currentUser) {
                showToast('账号名称未发生变化。');
                return;
            }

            try {
                const res = await fetch('/api/user/update', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username: newUsername })
                });
                if (res.ok) {
                    localStorage.setItem(authUserKey, newUsername);
                    showToast('账号名称已更新。');
                    document.getElementById('accountFeedback').innerText = '保存成功。';
                    setTimeout(() => {
                        document.getElementById('accountFeedback').innerText = '';
                    }, 3000);
                } else if (res.status === 409) {
                    showToast('该账号名称已被占用，请更换。', true);
                } else {
                    const result = await res.json().catch(() => ({}));
                    showToast(result.error || '更新账号名称失败。', true);
                }
            } catch (err) {
                console.error(err);
                showToast('保存失败，请重试。', true);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            restoreUserInfo();
            NotificationManager.loadSettings();
            updateNotificationSettingsUI();
            // 加载用户和公共的背景/字体资源
            loadAssets();
            // 恢复上次打开的面板
            const last = localStorage.getItem('settings_open_panel');
            if (last) setPanelState(last);
        });

        function getAuthToken() {
            return localStorage.getItem(authTokenKey) || '';
        }

        // 切换个性化面板（bg 或 font），保证互斥展开并更新按钮样式
        function togglePanel(which) {
            const current = localStorage.getItem('settings_open_panel') || '';
            if (current === which) {
                setPanelState(null);
            } else {
                setPanelState(which);
            }
        }

        function setPanelOpen(panelEl, open) {
            if (!panelEl) return;
            if (open) {
                panelEl.classList.remove('hidden');
                requestAnimationFrame(() => {
                    panelEl.classList.add('open');
                });
                return;
            }

            panelEl.classList.remove('open');
            // 若元素已处于 hidden，直接结束；否则延迟隐藏，避免卡住
            const hideTimer = panelEl.dataset.hideTimer;
            if (hideTimer) {
                clearTimeout(Number(hideTimer));
            }
            const timer = setTimeout(() => {
                panelEl.classList.add('hidden');
                panelEl.removeAttribute('data-hide-timer');
            }, 360);
            panelEl.dataset.hideTimer = String(timer);
        }

        function setPanelState(which) {
            const bgPanel = document.getElementById('bgPanel');
            const fontPanel = document.getElementById('fontPanel');
            const openBgBtn = document.getElementById('openBgBtn');
            const openFontBtn = document.getElementById('openFontBtn');
            if (!bgPanel || !fontPanel || !openBgBtn || !openFontBtn) return;

            const isBg = which === 'bg';
            const isFont = which === 'font';

            setPanelOpen(bgPanel, isBg);
            setPanelOpen(fontPanel, isFont);

            // 按钮状态：激活与收起互斥
            openBgBtn.classList.toggle('bg-blue-600', isBg);
            openBgBtn.classList.toggle('bg-slate-200', !isBg);
            openBgBtn.classList.toggle('text-white', isBg);
            openBgBtn.classList.toggle('text-slate-700', !isBg);

            openFontBtn.classList.toggle('bg-slate-800', isFont);
            openFontBtn.classList.toggle('bg-slate-200', !isFont);
            openFontBtn.classList.toggle('text-white', isFont);
            openFontBtn.classList.toggle('text-slate-700', !isFont);

            if (which) {
                localStorage.setItem('settings_open_panel', which);
            } else {
                localStorage.removeItem('settings_open_panel');
            }
        }

        async function uploadAsset(inputId, fileType) {
            const input = document.getElementById(inputId);
            if (!input || !input.files || input.files.length === 0) return;
            const file = input.files[0];
            if (!file) return;

            const visibilityName = fileType === 'font' ? 'fontVisibility' : 'bgVisibility';
            const visibility = document.querySelector(`input[name="${visibilityName}"]:checked`).value || 'private';

            const form = new FormData();
            form.append('file', file);
            form.append('visibility', visibility);
            form.append('username', localStorage.getItem(authUserKey) || 'anonymous');
            form.append('file_type', fileType);

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: form });
                if (!res.ok) {
                    showToast('上传失败', true);
                    return;
                }
                const data = await res.json();
                if (data && data.url) {
                    showToast('上传成功');
                    // 如果上传成功，自动将其设置为当前用户的背景/字体（私密或公开均可被设置）
                    if (fileType === 'background') {
                        await fetch('/api/user/background', {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${getAuthToken()}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: data.url })
                        });
                    } else if (fileType === 'font') {
                        await fetch('/api/user/font', {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${getAuthToken()}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: data.url })
                        });
                    }
                    // 刷新资源列表
                    loadAssets();
                }
            } catch (err) {
                console.error(err);
                showToast('上传出错', true);
            } finally {
                input.value = '';
            }
        }

        async function loadAssets() {
            const username = localStorage.getItem(authUserKey) || '';
            try {
                const [pubBgRes, userBgRes, pubFontRes, userFontRes] = await Promise.all([
                    fetch('/api/assets?scope=public&type=background'),
                    fetch(`/api/assets?scope=user&username=${encodeURIComponent(username)}&type=background`),
                    fetch('/api/assets?scope=public&type=font'),
                    fetch(`/api/assets?scope=user&username=${encodeURIComponent(username)}&type=font`),
                ]);
                const pubBg = await pubBgRes.json().catch(() => ({assets:[]}));
                const userBg = await userBgRes.json().catch(() => ({assets:[]}));
                const pubFont = await pubFontRes.json().catch(() => ({assets:[]}));
                const userFont = await userFontRes.json().catch(() => ({assets:[]}));

                // 保存到全局以便画廊打开时使用
                window.publicBgAssets = pubBg.assets || [];
                window.userBgAssets = userBg.assets || [];
                window.publicFontAssets = pubFont.assets || [];
                window.userFontAssets = userFont.assets || [];

                renderBgList('publicBgList', window.publicBgAssets);
                renderBgList('userBgList', window.userBgAssets);
                renderFontList('publicFontList', window.publicFontAssets);
                renderFontList('userFontList', window.userFontAssets);
            } catch (err) {
                console.error('加载资源失败', err);
            }
        }

        function renderBgList(containerId, assets) {
            const c = document.getElementById(containerId);
            if (!c) return;
            c.innerHTML = '';
            assets.forEach(url => {
                const el = document.createElement('div');
                el.className = 'w-24 h-16 bg-center bg-cover rounded-md border cursor-pointer';
                el.style.backgroundImage = `url('${url}')`;
                el.onclick = async () => {
                    await fetch('/api/user/background', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${getAuthToken()}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url })
                    });
                    document.body.style.backgroundImage = `url('${url}')`;
                    showToast('背景已应用');
                };
                // 右键打开原图预览
                el.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    const win = window.open(url, '_blank');
                    if (!win) showToast('弹窗被阻止，请允许弹窗以查看预览', true);
                });
                c.appendChild(el);
            });
        }

        function renderFontList(containerId, assets) {
            const c = document.getElementById(containerId);
            if (!c) return;
            // 回收此前生成的预览 blob URL，避免内存泄漏
            revokeAllPreviewUrls();
            c.innerHTML = '';
            assets.forEach(url => {
                const card = document.createElement('div');
                card.className = 'p-3 rounded border flex items-center justify-between';
                const lbl = document.createElement('div');
                lbl.innerText = url.split('/').pop();
                lbl.style.fontSize = '16px';
                lbl.style.flex = '1';
                const sample = document.createElement('div');
                sample.innerText = '示例文本';
                sample.className = 'px-2 py-1 text-sm';
                sample.style.marginRight = '8px';
                const btn = document.createElement('button');
                btn.className = 'px-3 py-1 bg-slate-100 rounded text-sm';
                btn.innerText = '使用';
                btn.onclick = async () => {
                    const fontName = 'userfont_' + Math.random().toString(36).slice(2,8);
                    const srcUrl = await getUsableUrlForAsset(url);
                    if (!srcUrl) { showToast('无法加载字体', true); return; }
                    const style = document.createElement('style');
                    const ext = (srcUrl.split('.').pop() || '').split('?')[0].toLowerCase();
                    let fmt = 'truetype';
                    if (ext === 'woff2') fmt = 'woff2';
                    else if (ext === 'woff') fmt = 'woff';
                    else if (ext === 'otf') fmt = 'opentype';
                    else if (ext === 'ttf') fmt = 'truetype';
                    style.innerText = `@font-face{font-family:'${fontName}';src: url('${srcUrl}') format('${fmt}');font-display:swap;}`;
                    document.head.appendChild(style);
                    await fetch('/api/user/font', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${getAuthToken()}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url })
                    });
                    showToast('字体已应用');
                };
                card.appendChild(lbl);
                card.appendChild(sample);
                card.appendChild(btn);
                c.appendChild(card);

                (async () => {
                    const srcUrl = await getUsableUrlForAsset(url);
                    if (!srcUrl) return;
                    const previewName = 'pf_' + Math.random().toString(36).slice(2,8);
                    const s = document.createElement('style');
                    const ext2 = (srcUrl.split('.').pop() || '').split('?')[0].toLowerCase();
                    let fmt2 = 'truetype';
                    if (ext2 === 'woff2') fmt2 = 'woff2';
                    else if (ext2 === 'woff') fmt2 = 'woff';
                    else if (ext2 === 'otf') fmt2 = 'opentype';
                    else if (ext2 === 'ttf') fmt2 = 'truetype';
                    s.innerText = `@font-face{font-family:'${previewName}';src: url('${srcUrl}') format('${fmt2}');font-display:swap;}`;
                    document.head.appendChild(s);
                    try {
                        await document.fonts.load(`16px ${previewName}`);
                        sample.style.fontFamily = previewName + ', sans-serif';
                    } catch (err) {
                    }
                })();
            });
        }

        async function getUsableUrlForAsset(url) {
            if (url.startsWith('/photos/uploads/') && !url.startsWith('/photos/uploads/userpublic/')) {
                try {
                    const token = getAuthToken();
                    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                    if (!res.ok) return null;
                    const blob = await res.blob();
                    const obj = URL.createObjectURL(blob);
                    window._createdPreviewUrls = window._createdPreviewUrls || [];
                    window._createdPreviewUrls.push(obj);
                    return obj;
                } catch (err) { return null; }
            }
            return url;
        }

        function revokeAllPreviewUrls() {
            if (window._createdPreviewUrls && window._createdPreviewUrls.length) {
                window._createdPreviewUrls.forEach(u => {
                    try { URL.revokeObjectURL(u); } catch (e) {}
                });
                window._createdPreviewUrls = [];
            }
        }

        // 为每个字体条目注入 @font-face 以展示预览样式（异步加载）
        function renderFontPreviews(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const cards = container.querySelectorAll('div');
            Array.from(cards).forEach(async (card, idx) => {
                const name = card.querySelector('div');
                if (!name) return;
                const fileName = name.innerText;

        }
    </script>
    <!-- 画廊模态窗口：在页面内全览并选择背景 -->
    <div id="galleryModal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
        <div class="absolute inset-0 bg-black/50" onclick="closeGallery()"></div>
        <div class="relative bg-white rounded-xl max-w-4xl w-full max-h-[80vh] overflow-auto p-4">
            <div class="flex justify-between items-center mb-3">
                <div id="galleryTitle" class="font-semibold">画廊</div>
                <div class="flex items-center gap-2">
                    <button onclick="closeGallery()" class="px-3 py-1 bg-slate-100 rounded">关闭</button>
                </div>
            </div>
            <div id="galleryGrid" class="grid grid-cols-3 gap-3"></div>
        </div>
    </div>

    <script>
        function toggleCollapse(id) {
            const el = document.getElementById(id);
            if (!el) return;
            if (el.style.display === 'none' || getComputedStyle(el).display === 'none') {
                el.style.display = '';
            } else {
                el.style.display = 'none';
            }
        }

        async function openGallery(urls, title) {
            if (!urls || !Array.isArray(urls)) urls = [];
            await populateGallery(urls, title || '画廊');
            document.getElementById('galleryModal').classList.remove('hidden');
        }

        async function populateGallery(urls, title) {
            const grid = document.getElementById('galleryGrid');
            const titleEl = document.getElementById('galleryTitle');
            grid.innerHTML = '';
            titleEl.innerText = title || '';
            window._createdPreviewUrls = window._createdPreviewUrls || [];
            // 回收之前的预览对象 URL，确保不会越来越多
            // 但不要回收刚刚要使用的新 URL（它们会被加入并在 closeGallery 时回收）
            // 调用 revokeAllPreviewUrls 以清理先前生成的 blob URLs
            revokeAllPreviewUrls();
            for (const url of urls) {
                const cell = document.createElement('div');
                cell.className = 'cursor-pointer';
                const img = document.createElement('img');
                img.className = 'w-full h-40 object-cover rounded';
                let src = url;
                if (url.startsWith('/photos/uploads/') && !url.startsWith('/photos/uploads/userpublic/')) {
                    const u = await getUsableUrlForAsset(url);
                    if (u) {
                        src = u;
                        window._createdPreviewUrls.push(u);
                    }
                }
                img.src = src;
                img.onload = () => img.classList.add('loaded');
                img.onerror = () => img.classList.add('error');
                img.onclick = async () => {
                    try {
                        await fetch('/api/user/background', {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${getAuthToken()}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url })
                        });
                        document.body.style.backgroundImage = `url('${src}')`;
                        showToast('背景已应用');
                        closeGallery();
                    } catch (err) {
                        console.error(err);
                        showToast('应用背景失败', true);
                    }
                };
                cell.appendChild(img);
                grid.appendChild(cell);
            }
        }

        function closeGallery() {
            const m = document.getElementById('galleryModal');
            if (!m) return;
            m.classList.add('hidden');
            // 回收临时 blob URL
            if (window._createdPreviewUrls && window._createdPreviewUrls.length) {
                window._createdPreviewUrls.forEach(u => {
                    try { URL.revokeObjectURL(u); } catch (e) {}
                });
                window._createdPreviewUrls = [];
            }
        }

        // 页面卸载时清理 blob URLs
        window.addEventListener('beforeunload', () => {
            try { revokeAllPreviewUrls(); } catch (e) {}
        });
    </script>
